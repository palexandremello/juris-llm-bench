[project]
name = "juris-llm-bench"
version = "0.1.0"
description = "Compara LLMs locais (Ollama) na extração de dados de textos jurídicos, contra um gabarito."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.1",
    "pyyaml>=6.0",
]

[project.scripts]
juris-llm-bench = "juris_llm_bench:main"

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
